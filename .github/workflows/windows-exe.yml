name: windows-exe

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m unittest discover -s tests -v

  build-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m PyInstaller --noconfirm --clean edac.spec
      - name: Verifier l'artefact
        shell: pwsh
        run: |
          $exe = "dist/EDAC-Console.exe"
          if (-not (Test-Path $exe)) { throw "artefact manquant" }
          Get-Item $exe | Select-Object Name, Length
          (Get-FileHash $exe -Algorithm SHA256).Hash
      - uses: actions/upload-artifact@v4
        with:
          name: EDAC-Console-windows
          path: dist/EDAC-Console.exe
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EDAC-Console.exe
